# Plan item 27 (decision 0085): the web app's production server. It serves the
# static build from /usr/share/nginx/html and proxies /api/ to the api, so the
# browser sees one origin and needs no CORS.
#
# Included inside the image's http block (nginx-unprivileged: uid 101, port
# 8080, pid and temp files under /tmp).

# The access log records the path without its query string, never $request,
# $request_uri or $args: an SSE stream's single-use ticket travels in the query
# string (EventSource cannot send headers), and this log must never hold one.
# $request_path is the path the browser asked for, cut at the first "?" (not
# $uri, which the /api/ rewrite changes to the api's own path, so nginx's
# lines would read like the api's). The image's http-level
# `access_log ... main` logs "$request", so the server below sets its own. The
# client is $remote_addr: what nginx itself saw.
map $request_uri $request_path {
    "~^(?<path_only>[^?]*)" $path_only;
}
log_format no_query '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log no_query;
    server_tokens off;

    # Docker's embedded DNS, re-asked every 10 s: `api` is resolved per request
    # (through $api_upstream below) instead of once at start, so a recreated api
    # container with a new address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Security headers for what nginx serves itself. The api sets its own on
    # its responses (main.py, _security_headers), so the /api/ locations add
    # none. add_header in a location replaces the server's set, so each
    # location that serves files includes the same snippet.
    #
    # The CSP is enforced, not report-only. The app loads only its own scripts,
    # styles, fonts and images; React sets styles through the DOM, which CSP
    # does not block; nothing uses blob:, eval or inline scripts. report-uri
    # makes the browser send any violation to /csp-report, which is logged and
    # answered 204: a POST /csp-report line in the access log is a violation.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'; report-uri /csp-report";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /csp-report {
        client_max_body_size 16k;
        return 204;
    }

    # Content-hashed build output: a changed file gets a new name, so a year
    # and immutable is safe. Not `always`: a missing asset's 404 must not be
    # cached for a year (observed with `always` on the first build).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Everything else: a file if one exists (favicon, fonts), otherwise the
    # app's index.html, so a reload on /tenders/... serves the app and its
    # router takes over. no-cache: the browser revalidates index.html on every
    # load, so a deploy's new asset names are picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri /index.html;
    }

    # The two SSE streams: buffering off, so each event reaches the browser as
    # the api sends it, not in bursts. The api sends a heartbeat comment every
    # second when there is nothing new, so the read timeout (60 s, nginx's
    # default, set here explicitly) is never reached on a live stream.
    location ~ ^/api/(workflow-runs|operations)/[^/]+/events/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # The api, with the /api prefix removed: the browser asks for
    # /api/tenders/..., the api serves /tenders/....
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
        # The api's own limit (max_upload_size_mb, 50 MB) decides; nginx's
        # default of 1 MB would answer uploads between 1 and 50 MB with its own
        # 413 first. Slightly above, so the api's 413 is the one sent.
        client_max_body_size 51m;
    }
}
