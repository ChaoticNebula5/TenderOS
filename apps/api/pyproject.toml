[project]
name = "tenderos-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "anyio>=4.14.2",
    "fastapi>=0.148.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "redis>=5.2",
    "neo4j>=5.26,<6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "tenderos-backend",
]

[tool.uv.sources]
tenderos-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderos_api"]
