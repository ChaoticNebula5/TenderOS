[project]
name = "tenderos-worker"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "rq>=2.0",
    "redis>=5.2",
    "asyncpg>=0.30",
    "pydantic-settings>=2.16.0",
    "tenderos-backend",
]

[tool.uv.sources]
tenderos-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderos_worker"]
