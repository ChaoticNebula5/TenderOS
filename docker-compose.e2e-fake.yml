# B17: fake-provider E2E overlay - a SEPARATE file from docker-compose.
# e2e.yml, deliberately, not an addition to it. docker-compose.e2e.yml
# also drives this project's real, live-cost E2E verification runs (the
# rate-limit bypass it sets has nothing to do with which LLM provider is
# used) - folding LLM_PROVIDER=fake into that same file would mean every
# future "run the real live-cost E2E scenario" invocation silently became
# a fake run unless someone remembered to strip this override back out.
# Two separate, explicit choices instead: pass this file when the
# reachability question is what's being answered (free, deterministic,
# no provider dependency), and docker-compose.e2e.yml with
# docker-compose.live.yml (scripts/real-stack.ps1) when a real provider run
# is what's needed. (Since Phase 4 plan item 46, docker-compose.yml alone
# is already fake with blank keys; this file stays, so the fake stack does
# not depend on the base default and CI's COMPOSE_FILE still names it.) See
# KNOWN_LIMITATIONS.md's own exit-criteria note: a fake-provider green run
# proves the scenario/UI/orchestration/gates/SSE reachable; it proves
# nothing about the provider path, and never substitutes for the one real
# live run Part N line 3929 still requires.
#
# core/config.py's own hard guard refuses to start at all if this is ever
# combined with APP_ENV=production - see
# _reject_fake_provider_in_production.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#        -f docker-compose.e2e-fake.yml up -d --build api web workflow_worker ingestion_worker maintenance_worker operations_worker outbox_dispatcher
#
# B17 Phase 0: every Gemini key is also blanked here, not only the provider
# switched. `environment:` beats the base file's `env_file: .env`, so a stray
# call that bypassed build_llm_client() and built a GeminiClient directly
# would fail on an empty key instead of spending real budget. The fake run
# then cannot spend money even if the provider switch alone were bypassed.
x-fake-provider: &fake-provider
  LLM_PROVIDER: "fake"
  GEMINI_API_KEY: ""
  COMPLIANCE_GEMINI_API_KEY: ""
  TALENT_GEMINI_API_KEY: ""
  COMMERCIAL_GEMINI_API_KEY: ""

services:
  api:
    environment: *fake-provider
  workflow_worker:
    environment: *fake-provider
  ingestion_worker:
    environment: *fake-provider
  maintenance_worker:
    environment: *fake-provider
  operations_worker:
    environment: *fake-provider
  outbox_dispatcher:
    environment: *fake-provider
