repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: eslint-web
        name: eslint (apps/web)
        entry: npm --prefix apps/web run lint
        language: system
        files: ^apps/web/
        pass_filenames: false

      - id: prettier-web
        name: prettier check (apps/web)
        entry: npm --prefix apps/web run format
        language: system
        files: ^apps/web/
        pass_filenames: false
