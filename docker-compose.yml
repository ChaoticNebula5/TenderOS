# Phase 4 item 7: every image is pinned as tag@sha256:digest, at the exact
# version and digest that ran before pinning (PostgreSQL 16.13 with pgvector
# 0.8.2, Redis 7.4.8, Neo4j 5.26.28, Prometheus 3.13.1, Grafana 13.1.1). The
# tag is for people; Docker pulls the digest. Dependabot's docker-compose
# entry (.github/dependabot.yml) proposes new versions with their digests,
# and scripts/check_pins.py fails CI if ci.yml's service images drift from
# these.
#
# Every port is published on the loopback addresses only. Published as
# "6379:6379", Docker listens on every interface, and Redis here has no
# password, so anyone on the same network could write an RQ job, whose
# payload the worker unpickles: code execution in the worker. Each port is
# published twice, on 127.0.0.1 and [::1]: the dev host resolves localhost
# to ::1 first, and with only 127.0.0.1 every new connection to localhost
# waited about 2 s for the refused ::1 attempt (measured 2026-10-24). The
# containers still reach each other by service name on the compose network;
# only the host side moves.
#
# Phase 4 plan item 46: the stack this file starts never reaches the live
# LLM provider. The api, the four workers, outbox_dispatcher and migrate get
# LLM_PROVIDER=fake and every Gemini key blank in `environment:`, which
# beats `env_file: .env`; the values are literals, with no ${...}, so
# neither .env nor a variable in the shell changes them. A plain
# `docker compose up` once came up on the live provider from .env and made
# 25 requests before it was caught (2026-11-04). The blank keys mean even a
# `docker compose exec -e LLM_PROVIDER=gemini` has no key to spend with.
# Live runs only through scripts/real-stack.ps1, which adds
# docker-compose.live.yml (provider and keys back), a named file CI never
# uses (scripts/check_ci_stays_fake.py). migrate gets the same: it calls no
# LLM, but its image holds the whole backend, so a `docker compose run
# migrate python ...` would otherwise have the live provider and the keys.
# web reads no .env.
x-fake-provider: &fake-provider
  LLM_PROVIDER: "fake"
  GEMINI_API_KEY: ""
  COMPLIANCE_GEMINI_API_KEY: ""
  TALENT_GEMINI_API_KEY: ""
  COMMERCIAL_GEMINI_API_KEY: ""

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host port 5433, not 5432: on the Windows dev host a native PostgreSQL
    # service (and WSL's localhost relay) can hold 5432 first, and host-side
    # scripts and pytest then reach the wrong server (KNOWN_LIMITATIONS.md,
    # environment traps, incident 2). Containers still use postgres:5432.
    ports:
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.32-community@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "[::1]:7474:7474"
      - "127.0.0.1:7687:7687"
      - "[::1]:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # S3-compatible object store behind the unchanged boto3 adapter
  # (db/storage.py). VersityGW replaces MinIO: minio/minio is no longer
  # pullable from Docker Hub and upstream MinIO is archived. A recorded
  # deviation from A2 (Build Guide :153) under section 0.1 - see
  # KNOWN_LIMITATIONS.md. Pinned by digest; the tag is for readability.
  s3:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    command: ["--health", "/health", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      VGW_PORT: ":9000"
    volumes:
      - s3_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "[::1]:9000:9000"
    healthcheck:
      # The image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 4 item 4: migrations run once, before anything that uses the
  # schema. A one-shot service on the api image (alembic.ini and the
  # migrations are in it), which exits 0 at head; api, the four workers
  # and outbox_dispatcher start only after it has
  # completed successfully, so a failing migration keeps them all down.
  # Not in the api's own entrypoint: with more than one api replica, each
  # would race to migrate. On a host with a release phase, this command
  # becomes the release command. A second start is a no-op (alembic finds
  # the database at head, and the constraints use IF NOT EXISTS).
  #
  # Phase 4 plan item 49: it also applies Neo4j's uniqueness constraints, after
  # Alembic. Fails closed: a key that already has two nodes stops the app
  # services until someone runs scripts/rebuild_graph.py. So it waits for a
  # healthy Neo4j, and `docker compose up` of any app service won't start one
  # during a Neo4j outage. One already running keeps running.
  migrate:
    # Phase 4 item 28: Docker's init (tini) is PID 1. It forwards SIGTERM to
    # the program and reaps orphaned child processes; the program then has
    # ordinary signal defaults, and still handles SIGTERM itself.
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -c
      - /app/.venv/bin/alembic upgrade head && /app/.venv/bin/python -m tenderos_backend.graph_projection.apply_constraints
    env_file: .env
    environment: *fake-provider
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  api:
    # Phase 4 blocker 3: come back after a crash or a host restart, but
    # stay down after an explicit `docker compose stop`.
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      <<: *fake-provider
      # Plan item 27: trust X-Forwarded-For only from the web container's
      # nginx (its fixed address on the proxy network below), never "*".
      # uvicorn reads this as --forwarded-allow-ips; it has --proxy-headers
      # on (apps/api/Dockerfile). A request from anywhere else, including the
      # published port below, keeps its own address, whatever header it sends.
      FORWARDED_ALLOW_IPS: "10.89.27.10"
    networks:
      - default
      - proxy
    # Loopback only, for local tools and the E2E's health wait. Requests here
    # come from Docker's host gateway, not from nginx, so their forwarded
    # headers are ignored and they share one rate-limit bucket (the
    # gateway's). Production must not publish this port: only nginx is
    # exposed (host-dependent items).
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Phase 4 item 28: uvicorn stops accepting connections on SIGTERM and
    # waits for open ones, for at most 10 s (--timeout-graceful-shutdown in
    # apps/api/Dockerfile's CMD: an open SSE stream would otherwise hold the
    # shutdown until Docker kills it). 20 s leaves room for the lifespan
    # shutdown after that.
    stop_grace_period: 20s
    healthcheck:
      # /health/ready (not /health/live) - checks real Postgres/Redis/
      # Neo4j/object-storage connectivity, not just "the process is up." Does NOT
      # detect the healthy-but-unreachable-from-the-host trap (KNOWN_
      # LIMITATIONS.md's environment-traps entry, incidents 6/8) - that's
      # a host-to-container port-publish failure, invisible to any check
      # this container runs against itself. This only improves what an
      # in-container check can see; it doesn't close that trap.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 4 plan item 44: one RQ worker per queue, so no queue waits behind
  # another's job. Each still runs one job at a time, as the single worker
  # did, so nothing new runs concurrently. Before, one worker served
  # ingestion, workflow, projection, evaluation and maintenance in that
  # order: an upload's parse waited for a running workflow job (up to
  # 1800 s), and the maintenance consumer waited behind both (observed in
  # CI: an outbox row consumed 9.4 s after it was written). All three use
  # the worker image; worker.py takes the queue names as arguments.
  #
  # Workflow jobs: run, resume, verification, knowledge import, reanalysis
  # and scheduled retries, each up to 1800 s (outbox_dispatcher.py,
  # _QUEUE_TIMEOUTS_SECONDS). On SIGTERM, RQ stops taking jobs and lets the
  # job in progress finish (warm shutdown); it does not requeue it, and a
  # run whose job is killed stays `running` (the workflow-run reaper is
  # designed, not built: decision 0035). So the grace period covers the
  # longest job plus a margin. An idle worker stops in about 2 s
  # (observed); to stop sooner and accept losing the job in progress,
  # `docker compose stop -t <seconds> workflow_worker`.
  workflow_worker:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "tenderos_worker.worker", "workflow"]
    env_file: .env
    environment: *fake-provider
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 31m

  # Document parse and embed, up to 600 s per job (_QUEUE_TIMEOUTS_SECONDS).
  ingestion_worker:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "tenderos_worker.worker", "ingestion"]
    env_file: .env
    environment: *fake-provider
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 11m

  # The outbox events with no dedicated consumer (process_outbox_event,
  # RQ's default 180 s). Also serves projection and evaluation, which have
  # no producers today, so anything enqueued there later is not stranded.
  maintenance_worker:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command:
      ["/app/.venv/bin/python", "-m", "tenderos_worker.worker", "maintenance", "projection", "evaluation"]
    env_file: .env
    environment: *fake-provider
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 4m

  # Phase 4 Stage 2: the worker for async operations (red team, proposal
  # generation, commercial re-validation), listening only to the
  # "operations" queue, so an operation a person clicked never waits behind
  # a workflow job on the workflow_worker service above. Same image and env
  # as the other workers; like them, no healthcheck.
  # It imports the operations job module once before forking jobs
  # (worker.py, preload_operations_module); BLAS is pinned to one thread so
  # that import adds no thread, and the worker refuses to start if it does
  # (numpy's and scipy's OpenBLAS otherwise start 15 threads each). RQ's own
  # pubsub listener thread, which every RQ worker runs, is separate.
  operations_worker:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "tenderos_worker.worker", "operations"]
    env_file: .env
    environment:
      <<: *fake-provider
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Phase 4 item 28: as for workflow_worker. An operation's job runs up to 1800 s
    # (operation_service.JOB_TIMEOUT_SECONDS). A killed one is failed by the
    # dispatcher's reaper as WORKER_LOST, but only once its lease (the job
    # timeout plus 60 s) has lapsed, so killing it early loses the work
    # without letting the user retry any sooner.
    stop_grace_period: 31m

  outbox_dispatcher:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "tenderos_worker.outbox_dispatcher"]
    env_file: .env
    environment: *fake-provider
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Phase 4 item 28: on SIGTERM the dispatcher finishes its current tick
    # and exits (outbox_dispatcher._run_until_terminated). A tick is bounded
    # by its Redis and lock timeouts; delivery is at-least-once (decision
    # 0029), so even a kill mid-tick loses nothing.
    stop_grace_period: 30s

  # Plan item 27 (decision 0085): nginx serving the static build and proxying
  # /api/ to the api. It listens on 8080 in the container; the host side
  # stays 5173, so Playwright's baseURL, CI's wait and web_base_url are
  # unchanged. It joins only the proxy network, at a fixed address, so every
  # request it makes to the api comes from 10.89.27.10, the one address the
  # api trusts for X-Forwarded-For.
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks:
      proxy:
        ipv4_address: 10.89.27.10
    ports:
      - "127.0.0.1:5173:8080"
      - "[::1]:5173:8080"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
      - "[::1]:9090:9090"

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  s3_data:
  grafana_data:

networks:
  # Plan item 27: nginx (web) and the api only. A fixed subnet, outside
  # Docker's default pools (172.17-31, 192.168), so web's address is known
  # and the api can trust exactly it (FORWARDED_ALLOW_IPS above). Added
  # alongside the default network, which every other service keeps.
  proxy:
    ipam:
      config:
        - subnet: 10.89.27.0/28
