    exp_alerts: []
- name: three runs failing within an hour fires, for an hour
  interval: 15s
  input_series:
  - series: tenderos_workflow_runs{status="failed"}
    values: 10x10 11 12 13x300
  alert_rule_test:
  - eval_time: 180s
    alertname: RunsFailing
    exp_alerts: []
  - eval_time: 210s
    alertname: RunsFailing
