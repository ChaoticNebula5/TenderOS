    values: 0x10 1x300
  - series: tenderos_workflow_runs_ended_by_system_total{action="workflow_run_reaped",rule="dead_letter"}
    values: 5x300
  - series: tenderos_workflow_runs_ended_by_system_total{action="workflow_run_reaped",rule="abandoned"}
    values: _x10 1x300
  - series: tenderos_workflow_runs_ended_by_system_total{action="workflow_run_reaped",rule="unknown"}
    values: 3x10 2x300
  alert_rule_test:
  - eval_time: 150s
    alertname: RunsEndedBySystem
    exp_alerts: []
  - eval_time: 180s
    alertname: RunsEndedBySystem
    exp_alerts:
    - exp_labels:
        action: workflow_run_reaped
        rule: cap
        severity: warning
      exp_annotations:
        summary: The system ended a workflow run within the last hour (workflow_run_reaped, rule cap).
        first_check: The run's audit row and the dispatcher's reaper WARNING.
        estimate: The 1 hour window is an estimate; revisit with the Gemini run and at hosting.
  - eval_time: 2400s
    alertname: RunsEndedBySystem
    exp_alerts:
    - exp_labels:
        action: workflow_run_reaped
        rule: cap
        severity: warning
      exp_annotations:
        summary: The system ended a workflow run within the last hour (workflow_run_reaped, rule cap).
        first_check: The run's audit row and the dispatcher's reaper WARNING.
        estimate: The 1 hour window is an estimate; revisit with the Gemini run and at hosting.
  - eval_time: 3780s
