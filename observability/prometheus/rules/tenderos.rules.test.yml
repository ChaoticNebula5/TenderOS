# Observability PR 32: promtool unit tests for tenderos.rules.yml
# (`promtool test rules tenderos.rules.test.yml`, run in CI). Every alert has
# at least one case where it fires and one where it stays quiet; each case
# moves its series at a known moment and checks just before and just after
# its hold, so a changed threshold, hold, label or expression fails a check.
# promtool compares each expected alert's labels and annotations exactly.
# Series values: "a+bxn" is a, then n more samples each b higher; "_" is a
# missing sample (the series absent).
rule_files:
- tenderos.rules.yml
evaluation_interval: 15s
tests:
- name: a target down fires after 2 minutes, a healthy one never
  interval: 15s
  input_series:
  - series: up{job="api"}
    values: 1x3 0x40
  - series: up{job="metrics_exporter"}
    values: 1x50
  alert_rule_test:
  - eval_time: 165s
    alertname: TargetDown
    exp_alerts: []
  - eval_time: 195s
    alertname: TargetDown
    exp_alerts:
    - exp_labels:
        job: api
        severity: critical
      exp_annotations:
        summary: Prometheus cannot scrape api.
        first_check: docker compose ps and that service's log; for the exporter, whether METRICS_EXPORTER_DB_PASSWORD is set (it refuses to start without).
        estimate: The 2 minute hold is an estimate; revisit with the Gemini run and at hosting.
- name: a store the exporter cannot read fires after 2 minutes
  interval: 15s
  input_series:
  - series: tenderos_exporter_source_up{source="postgres"}
    values: 1x3 0x40
  - series: tenderos_exporter_source_up{source="redis"}
    values: 1x50
  alert_rule_test:
  - eval_time: 165s
    alertname: ExporterSourceDown
    exp_alerts: []
  - eval_time: 195s
    alertname: ExporterSourceDown
    exp_alerts:
    - exp_labels:
        source: postgres
        severity: critical
      exp_annotations:
        summary: The metrics_exporter cannot read postgres; every rule built on it is silent meanwhile.
        first_check: The exporter's 'cannot read postgres' line, then that store's container.
        estimate: The 2 minute hold is an estimate; revisit with the Gemini run and at hosting.
- name: a dependency down fires after 2 minutes
  interval: 15s
  input_series:
  - series: tenderos_dependency_up{dependency="neo4j"}
    values: 1x3 0x40
  - series: tenderos_dependency_up{dependency="postgres"}
    values: 1x50
  alert_rule_test:
  - eval_time: 165s
    alertname: DependencyDown
    exp_alerts: []
  - eval_time: 195s
    alertname: DependencyDown
    exp_alerts:
    - exp_labels:
        dependency: neo4j
        severity: critical
      exp_annotations:
        summary: The api cannot reach neo4j (or it answered later than 3 s).
        first_check: /health/ready's body, then the neo4j container. For neo4j, the graph routes answer 500 meanwhile.
        estimate: The 3 s check cap and the 2 minute hold are estimates; revisit with the Gemini run and at hosting.
- name: a queue with no live worker fires after 2 minutes
  interval: 15s
  input_series:
  - series: tenderos_rq_workers{queue="workflow"}
    values: 1x3 0x40
  - series: tenderos_rq_workers{queue="ingestion"}
    values: 1x50
  alert_rule_test:
  - eval_time: 165s
    alertname: QueueHasNoWorker
    exp_alerts: []
  - eval_time: 195s
    alertname: QueueHasNoWorker
    exp_alerts:
    - exp_labels:
        queue: workflow
        severity: critical
      exp_annotations:
        summary: No live worker serves the workflow queue.
        first_check: The worker container serving workflow (maintenance_worker serves maintenance, projection and evaluation). A clean stop shows at once; a crash once RQ's own key expires (up to 420 s).
        estimate: The 2 minute hold is an estimate; revisit with the Gemini run and at hosting.
- name: an idle worker's heartbeat (a 405 s sawtooth) stays quiet
  interval: 15s
  input_series:
  - series: tenderos_rq_heartbeat_age_seconds{queue="workflow"}
    values: 0+15x27 0+15x27 0+15x27
  alert_rule_test:
  - eval_time: 1200s
    alertname: WorkerHeartbeatStale
    exp_alerts: []
- name: a heartbeat past 600 s for a minute fires
  interval: 15s
  input_series:
  - series: tenderos_rq_heartbeat_age_seconds{queue="workflow"}
    values: 0+15x60
  alert_rule_test:
  - eval_time: 660s
    alertname: WorkerHeartbeatStale
    exp_alerts: []
  - eval_time: 690s
    alertname: WorkerHeartbeatStale
    exp_alerts:
    - exp_labels:
        queue: workflow
        severity: critical
      exp_annotations:
        summary: The workflow queue's worker heartbeat is over 600 s old.
        first_check: 'Whether the worker is alive but hung: its last log line and its current job.'
        estimate: '600 s is an estimate: an idle RQ worker heartbeats every 405 s (worker_ttl 420 minus 15), so it leaves 195 s of margin. Revisit with the Gemini run and at hosting.'
- name: a dispatcher ticking every 5 s stays quiet
  interval: 15s
  input_series:
  - series: tenderos_outbox_dispatcher_heartbeat_age_seconds
    values: 3x60
  alert_rule_test:
  - eval_time: 600s
    alertname: DispatcherHeartbeatStale
    exp_alerts: []
- name: a dispatcher past 120 s for a minute fires
  interval: 15s
  input_series:
  - series: tenderos_outbox_dispatcher_heartbeat_age_seconds
    values: 0+15x40
  alert_rule_test:
  - eval_time: 180s
    alertname: DispatcherHeartbeatStale
    exp_alerts: []
  - eval_time: 210s
    alertname: DispatcherHeartbeatStale
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: The outbox dispatcher has not finished a tick for over 120 s; nothing new reaches a worker.
        first_check: The dispatcher's 'tick failed' WARNINGs, then Postgres and Redis. It ticks every 5 s and stamps only after a tick that finished.
        estimate: 120 s is an estimate (its error backoff tops out at 60 s); revisit with the Gemini run and at hosting.
- name: no dispatcher heartbeat while Redis is readable fires after 5 minutes
  interval: 15s
  input_series:
  - series: tenderos_exporter_source_up{source="redis"}
    values: 1x40
  alert_rule_test:
  - eval_time: 285s
    alertname: DispatcherHeartbeatMissing
    exp_alerts: []
  - eval_time: 315s
    alertname: DispatcherHeartbeatMissing
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: The outbox dispatcher has not finished one tick since Redis was emptied.
        first_check: The outbox_dispatcher container and its log (fake-stack.ps1 empties Redis at each start).
        estimate: The 5 minute hold is an estimate; revisit with the Gemini run and at hosting.
- name: a dispatcher heartbeat present stays quiet
  interval: 15s
  input_series:
  - series: tenderos_exporter_source_up{source="redis"}
    values: 1x40
  - series: tenderos_outbox_dispatcher_heartbeat_age_seconds
    values: 3x40
  alert_rule_test:
  - eval_time: 315s
    alertname: DispatcherHeartbeatMissing
    exp_alerts: []
- name: no heartbeat while Redis cannot be read is left to ExporterSourceDown
  interval: 15s
  input_series:
  - series: tenderos_exporter_source_up{source="redis"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 315s
    alertname: DispatcherHeartbeatMissing
    exp_alerts: []
- name: only a dead letter that failed within the hour fires
  interval: 15s
  input_series:
  - series: tenderos_outbox_dead_letters{event_type="WorkflowRunCreated"}
    values: 1x300
  - series: tenderos_outbox_dead_letters{event_type="DocumentUploaded"}
    values: 0x10 1x300
  - series: tenderos_outbox_dead_letters{event_type="OperationRequested"}
    values: 2x10 1x300
  - series: tenderos_outbox_dead_letters{event_type="TenderCreated"}
    values: _x10 1x300
  - series: tenderos_outbox_dead_letters{event_type="GateDecisionRecorded"}
    values: 1x10 0x10 1x300
  alert_rule_test:
  - eval_time: 150s
    alertname: DeadLetter
    exp_alerts: []
  - eval_time: 330s
    alertname: DeadLetter
    exp_alerts:
    - exp_labels:
        event_type: DocumentUploaded
        severity: warning
      exp_annotations:
        summary: A DocumentUploaded outbox event failed every attempt within the last hour.
        first_check: The dispatcher's 'Failed to dispatch outbox event <id>' line for the cause (the Work dashboard lists every outstanding dead letter with its id), then a re-drive.
        estimate: 'The 1 hour window is an estimate; revisit with the Gemini run and at hosting. It fires on a new dead letter only: one that stays is listed on the Work dashboard, not alerted on again.'
    - exp_labels:
        event_type: GateDecisionRecorded
        severity: warning
      exp_annotations:
        summary: A GateDecisionRecorded outbox event failed every attempt within the last hour.
        first_check: The dispatcher's 'Failed to dispatch outbox event <id>' line for the cause (the Work dashboard lists every outstanding dead letter with its id), then a re-drive.
        estimate: 'The 1 hour window is an estimate; revisit with the Gemini run and at hosting. It fires on a new dead letter only: one that stays is listed on the Work dashboard, not alerted on again.'
  - eval_time: 2400s
    alertname: DeadLetter
    exp_alerts:
    - exp_labels:
        event_type: DocumentUploaded
        severity: warning
      exp_annotations:
        summary: A DocumentUploaded outbox event failed every attempt within the last hour.
        first_check: The dispatcher's 'Failed to dispatch outbox event <id>' line for the cause (the Work dashboard lists every outstanding dead letter with its id), then a re-drive.
        estimate: 'The 1 hour window is an estimate; revisit with the Gemini run and at hosting. It fires on a new dead letter only: one that stays is listed on the Work dashboard, not alerted on again.'
    - exp_labels:
        event_type: GateDecisionRecorded
        severity: warning
      exp_annotations:
        summary: A GateDecisionRecorded outbox event failed every attempt within the last hour.
        first_check: The dispatcher's 'Failed to dispatch outbox event <id>' line for the cause (the Work dashboard lists every outstanding dead letter with its id), then a re-drive.
        estimate: 'The 1 hour window is an estimate; revisit with the Gemini run and at hosting. It fires on a new dead letter only: one that stays is listed on the Work dashboard, not alerted on again.'
  - eval_time: 3930s
    alertname: DeadLetter
    exp_alerts: []
- name: a queue's head job waiting past 600 s for 5 minutes fires
  interval: 15s
  input_series:
  - series: tenderos_rq_queue_oldest_job_age_seconds{queue="workflow"}
    values: 0+15x80
  - series: tenderos_rq_queue_oldest_job_age_seconds{queue="ingestion"}
