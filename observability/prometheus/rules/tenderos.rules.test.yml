- name: a sustained limiter outage fires after 2 minutes
  interval: 15s
  input_series:
  - series: tenderos_rate_limiter_redis_unavailable_total
    values: 0x10 1+1x60
  alert_rule_test:
  - eval_time: 270s
    alertname: RateLimiterRedisDown
    exp_alerts: []
  - eval_time: 300s
    alertname: RateLimiterRedisDown
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: 'The rate limiter cannot reach Redis: login answers 503 and every other route goes unlimited.'
        first_check: Redis, then the api's rate limiter WARNING.
        estimate: The 1 minute window and the 2 minute hold are estimates (one request that found Redis gone must not fire it); revisit with the Gemini run and at hosting.
- name: one request that found Redis gone stays quiet
  interval: 15s
  input_series:
  - series: tenderos_rate_limiter_redis_unavailable_total
    values: 0x10 1x60
  alert_rule_test:
  - eval_time: 300s
    alertname: RateLimiterRedisDown
    exp_alerts: []
- name: a rising counter absent then appearing at 1 fires on the same schedule
  interval: 15s
  input_series:
  - series: tenderos_rate_limiter_redis_unavailable_total
    values: _x10 1+1x60
  alert_rule_test:
  - eval_time: 270s
    alertname: RateLimiterRedisDown
    exp_alerts: []
  - eval_time: 300s
    alertname: RateLimiterRedisDown
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: 'The rate limiter cannot reach Redis: login answers 503 and every other route goes unlimited.'
        first_check: Redis, then the api's rate limiter WARNING.
        estimate: The 1 minute window and the 2 minute hold are estimates (one request that found Redis gone must not fire it); revisit with the Gemini run and at hosting.
- name: a 429 surge fires once its floor and the 10 minute hold are passed
  interval: 15s
  input_series:
  - series: tenderos_http_requests_total{route="/tenders/{tender_id}",method="GET",code="200"}
    values: 0+15x100
  - series: tenderos_http_requests_total{route="unmatched",method="GET",code="429"}
    values: _x3 1+3x96
  alert_rule_test:
  - eval_time: 780s
    alertname: RateLimited429Surge
    exp_alerts: []
  - eval_time: 810s
    alertname: RateLimited429Surge
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Over 5% of api requests are answered 429.
        first_check: 'Whether every client arrives from one address (a host''s proxy putting every user in one bucket, item 1): nginx''s remote_addr.'
        estimate: 5%, 0.1 a second and the 10 minute hold are estimates; revisit with the Gemini run and at hosting.
- name: one 429 at low traffic stays quiet
  interval: 15s
  input_series:
  - series: tenderos_http_requests_total{route="/tenders/{tender_id}",method="GET",code="200"}
    values: 0+1x100
  - series: tenderos_http_requests_total{route="unmatched",method="GET",code="429"}
    values: 0x20 1x80
  alert_rule_test:
  - eval_time: 900s
    alertname: RateLimited429Surge
    exp_alerts: []
