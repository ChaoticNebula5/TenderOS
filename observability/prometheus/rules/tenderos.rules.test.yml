  alert_rule_test:
  - eval_time: 900s
    alertname: QueuedJobOld
    exp_alerts: []
  - eval_time: 930s
    alertname: QueuedJobOld
    exp_alerts:
    - exp_labels:
        queue: workflow
        severity: warning
      exp_annotations:
        summary: The workflow queue's oldest job has waited over 600 s.
        first_check: Live workers on workflow, and whether its worker is busy on one long job.
        estimate: 600 s and the 5 minute hold are estimates; revisit with the Gemini run and at hosting.
- name: a run queued past 600 s fires; a run at a gate 91 days never does
  interval: 15s
  input_series:
  - series: tenderos_workflow_run_oldest_age_seconds{status="queued"}
    values: 0+15x80
  - series: tenderos_workflow_run_oldest_age_seconds{status="waiting_for_human"}
    values: 7848202x80
  alert_rule_test:
  - eval_time: 900s
    alertname: RunQueuedTooLong
    exp_alerts: []
  - eval_time: 930s
    alertname: RunQueuedTooLong
    exp_alerts:
    - exp_labels:
        status: queued
        severity: warning
      exp_annotations:
        summary: A workflow run has been queued for over 600 s.
        first_check: The run's WorkflowRunCreated outbox row (pending, or a dead letter?) and the workflow queue.
        estimate: 600 s and the 5 minute hold are estimates; revisit with the Gemini run and at hosting.
  - eval_time: 930s
    alertname: RunJobTooLong
    exp_alerts: []
- name: a run's current job past an hour fires
  interval: 15s
  input_series:
  - series: tenderos_workflow_run_oldest_age_seconds{status="running"}
    values: 3000+15x80
  - series: tenderos_workflow_run_oldest_age_seconds{status="waiting_for_human"}
    values: 7848202x80
  alert_rule_test:
  - eval_time: 900s
    alertname: RunJobTooLong
    exp_alerts: []
  - eval_time: 930s
    alertname: RunJobTooLong
    exp_alerts:
    - exp_labels:
        status: running
        severity: warning
      exp_annotations:
        summary: A workflow run's current job has run for over an hour.
        first_check: The run's current job in RQ and the workflow worker's log. The reaper fails a job at 6 h (MAX_RUN_JOB_AGE); this is the warning before it.
        estimate: 1 hour and the 5 minute hold are estimates (a real run took up to 45 min); revisit with the Gemini run and at hosting.
- name: an operation queued past 600 s fires
  interval: 15s
  input_series:
  - series: tenderos_operation_oldest_age_seconds{status="queued"}
    values: 0+15x80
  - series: tenderos_operation_oldest_age_seconds{status="running"}
    values: '0x80'
  alert_rule_test:
  - eval_time: 900s
    alertname: OperationQueuedTooLong
    exp_alerts: []
  - eval_time: 930s
    alertname: OperationQueuedTooLong
    exp_alerts:
    - exp_labels:
        status: queued
        severity: warning
      exp_annotations:
        summary: An async operation has been queued for over 600 s.
        first_check: The operations queue and operations_worker.
        estimate: 600 s and the 5 minute hold are estimates; revisit with the Gemini run and at hosting.
- name: the first reap of a rule fires for an hour; old reaps never
  interval: 15s
  input_series:
