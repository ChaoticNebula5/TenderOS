- name: five reuses within an hour fire; four do not yet
  interval: 15s
  input_series:
  - series: tenderos_refresh_token_reuse_total
    values: 0x10 1 2 3 4 5x300
  alert_rule_test:
  - eval_time: 210s
    alertname: RefreshTokenReuseSpike
    exp_alerts: []
  - eval_time: 240s
    alertname: RefreshTokenReuseSpike
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: About 5 or more refresh tokens were presented again after rotation within the last hour.
        first_check: 'The reuse WARNINGs'' users: one user many times (a client bug, two tabs without Web Locks) or many users (a broken release, or theft). One reuse never fires: it has known false positives
          (item 34 option 3).'
