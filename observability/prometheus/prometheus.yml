# Observability PR 31: the api's own /metrics and the metrics_exporter, both on
# the compose network (neither port is published for them; the api's loopback
# port is for local tools). nginx answers /api/metrics with 404, so nothing
# outside the stack reads the api's metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Observability PR 32: the alert rules. No Alertmanager here: locally the
# alerts show as firing in Prometheus (/alerts) and in Grafana's Health
# dashboard; where they are sent is decided at hosting.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # tenderos_backend/core/metrics.py: requests by route template, method and
  # status code, their duration, the rate limiter's Redis outages,
  # refresh-token reuse, and each dependency's reachability (PR 32).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # tenderos_worker/metrics_exporter.py: queues, heartbeats, runs and
  # operations by status, dead letters, runs ended by the system.
  - job_name: metrics_exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics_exporter:9105"]
