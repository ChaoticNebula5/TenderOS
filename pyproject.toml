[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/tenderos_backend"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# B17 Phase 0b - a deliberate config WEAKENING, not a fix: E501 is not
# enforced in tests/ (112 long lines at the time) or scripts/ (20), which
# are dominated by long assertion messages, docstrings and fixture strings.
# Application source (apps/, packages/) stays at line-length 100 with E501
# enforced; its 37 long lines were wrapped instead.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "tenderos_api.dependencies.require_permission",
    "tenderos_api.dependencies.require_permission_for_sse",
    "tenderos_api.idempotency.get_idempotency_context",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Phase 4 item 29. Any SQLAlchemy warning fails its test. A connection the
# garbage collector finds unreturned warns from inside a GC callback, where
# the error cannot reach the test: if that happens during a test, pytest
# reports it as an unraisable exception, which the second line also makes
# an error; at a test boundary, tests/conftest.py catches it.
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
files = ["apps/api/src", "apps/worker/src", "packages/tenderos_backend/src"]
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/tenderos_backend/src",
]
