[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/tenderos_backend"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "tenderos_api.dependencies.require_permission",
    "tenderos_api.idempotency.get_idempotency_context",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
files = ["apps/api/src", "apps/worker/src", "packages/tenderos_backend/src"]
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/tenderos_backend/src",
]
