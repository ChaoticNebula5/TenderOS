[project]
name = "tenderos-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.0",
    "langgraph>=0.6",
    # LangGraph's own Postgres checkpointer (A3.1) is psycopg (v3)-based, not
    # asyncpg - it owns only its own checkpoint tables (created via .setup(),
    # not Alembic), never domain writes. See Part P: "verify current LangGraph
    # PostgreSQL checkpointer package/imports" - this pairing is the
    # build-time-verifiable piece, not a locked contract detail.
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.3.6",
    # B4: object storage, document parsing, OCR fallback, embeddings.
    "boto3>=1.35",
    "pgvector>=0.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "sentence-transformers>=3.3",
    # Pulled in transitively by sentence-transformers anyway - listed
    # explicitly so the [tool.uv.sources] CPU-only pin below actually applies
    # (uv only honors a source override for a package that is a direct
    # dependency somewhere in the workspace, not a transitive one).
    "torch>=2.0",
    # B5: first real LLM adapter (this project's own choice of first
    # provider - A2's literal locked-choice cell names Anthropic; flagged in
    # the B5 plan/commit message). Part P: verify this resolves to the SDK
    # surface agents/llm/gemini_adapter.py was written against.
    "google-genai>=0.3",
    # Phase 4: agents/llm/gemini_adapter.py catches httpx.TimeoutException
    # (google-genai's transport raises it on a request timeout), so it is a
    # direct dependency here, not only a transitive one. Same floor as
    # apps/api's.
    "httpx>=0.27",
    "pyyaml>=6.0",
    # B10: official Neo4j driver for graph_projection/. Same version pin
    # already used by apps/api's own health-check driver instance (verified
    # working against the live docker-compose neo4j service since B0/B1) -
    # matching it here rather than picking a fresh range.
    "neo4j>=6.4.1,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderos_backend"]

# sentence-transformers pulls in torch as a transitive dependency. PyPI's
# default torch wheel bundles full CUDA support (nvidia-cublas/cudnn/cufft/
# nccl/... - several GB) even though nothing in this stack uses a GPU (A2's
# locked table has no CUDA/GPU row). Pin torch to PyTorch's own CPU-only wheel
# index instead - same package, no CUDA payload.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
