version: 2

# Phase 4 batch 1, item 26. Dependabot opened 8 PRs on the first push
# (2026-10-07) and none since: the npm entry sat at the default limit of 5
# open version-update PRs, and every uv job failed (see .python-version).
# Each entry below now has three groups:
#   - minor and patch version updates in one PR, so a pile of
#     single-package PRs cannot reach the open-PR limit again;
#   - major version updates in a second PR, so a major is a deliberate,
#     visible change (PR #6 proposed vitest 4 -> 5 when the advisory fix
#     was 4.1.12) without being hidden;
#   - security updates in a third (not for Actions). Security updates have
#     their own fixed limit of 10 and do not count against
#     open-pull-requests-limit.
# There is deliberately no `ignore` on majors: GitHub applies ignore
# conditions to security updates too ("Controlling which dependencies are
# updated by Dependabot"), and an advisory can be fixed only in a major
# (pillow 12 -> 13 on 2026-10-22).
# Security updates also need "Dependabot security updates" turned on in the
# repository settings; this file cannot do that.
updates:
  # Root of the uv workspace - apps/api, apps/worker, and
  # packages/tenderos_backend all resolve through the one shared
  # uv.lock here, so one entry covers the whole Python dependency graph,
  # not one per workspace member.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      uv-majors:
        applies-to: version-updates
        update-types: ["major"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      # Phase 4 batch 2a. Groups match in order and the first match wins;
      # a dependency no group matches gets a PR of its own. The four
      # dependencies declared with extras (sqlalchemy[asyncio],
      # psycopg[binary,pool], uvicorn[standard], pydantic[email]) have no
      # current version in Dependabot's view, so they match no update-types
      # group: on 2026-10-22 they arrived as single PRs #24 to #26, and
      # pydantic[email]'s update was never opened as a PR (probably the
      # open-PR limit of 5; not confirmed). This last group catches whatever
      # the typed groups above did not. For those four the update type is
      # unknown, so a major among them lands here, not in uv-majors: read
      # this group's PR as possibly containing a major.
      uv-other:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      web-majors:
        applies-to: version-updates
        update-types: ["major"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  # apps/landing has its own package-lock.json and had no entry (its one
  # high advisory, 2026-10-22, was found by hand).
  - package-ecosystem: "npm"
    directory: "/apps/landing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      landing-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      landing-majors:
        applies-to: version-updates
        update-types: ["major"]
      landing-security:
        applies-to: security-updates
        patterns: ["*"]

  # Phase 4 item 7: ci.yml pins every action by commit SHA with its release
  # in a comment; Dependabot updates both. It does not read ci.yml's
  # `services:` images or setup-uv's and setup-node's version inputs;
  # scripts/check_pins.py fails CI when those drift from the images below.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-majors:
        applies-to: version-updates
        update-types: ["major"]

  # Phase 4 item 7: base images pinned as tag@sha256:digest in the three
  # Dockerfiles (Dependabot reads FROM lines, which is why uv is a named
  # FROM stage). One entry for all three, so the api and worker images move
  # together in one PR. No security group: Dependabot has no security
  # updates for docker images.
  - package-ecosystem: "docker"
    directories: ["/apps/api", "/apps/worker", "/apps/web"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Python 3.12 to 3.13 is a minor in the image tag's numbering but a
      # language upgrade here (.python-version, requires-python ==3.12.*),
      # so it gets a PR of its own instead of riding with patch updates.
      docker-python-minor:
        applies-to: version-updates
        patterns: ["python"]
        update-types: ["minor"]
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      docker-majors:
        applies-to: version-updates
        update-types: ["major"]

  # The images in docker-compose.yml, pinned the same way. ci.yml's service
  # images copy postgres, redis and neo4j from here, and Dependabot updates
  # only this file. Expected red: every docker-compose PR that moves one of
  # those three fails CI's lint job (scripts/check_pins.py) until ci.yml's
  # matching `services:` image is updated too. The fix is one commit on the
  # Dependabot branch changing that ci.yml image line to the PR's new
  # tag@digest.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      compose-majors:
        applies-to: version-updates
        update-types: ["major"]
