name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 4 item 7: every action is pinned by commit SHA, with its release in
# a comment, at the releases Dependabot's PR #17 proposed (its CI was green
# on exactly these SHAs, run 39821371762). Dependabot's github-actions entry
# updates the SHA and the comment together. setup-uv installs uv 0.13.5 and
# setup-node Node 22.23.4 (with npm 10.9.9), the versions the images use;
# scripts/check_pins.py, run in the lint job, fails if they drift apart, and
# if the service images below drift from docker-compose.yml's.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - run: uv sync
      - run: uv run ruff check .
      - name: Image, action and tool versions are pinned and agree
        run: uv run python scripts/check_pins.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - run: uv sync
      - run: uv run mypy

  # B16: this job previously ran `uv run pytest` with zero service
  # containers and no DB env vars - every DB-touching test would have
  # failed outright the moment this workflow ever executed. It never had:
  # no git remote is configured on this repo, so this file has run zero
  # times across 16 blocks. Every implicit "CI is green" assumption in
  # this project's history was therefore vacuous, not confirmed - the
  # first real run of this job is the first time it's ever been observed
  # at all, not a return to a previously-passing state.
  # B17 Phase 0b: the step env below used to set only 5 variables; the 6
  # required Settings fields with no default (jwt_signing_key, s3_access_key,
  # s3_secret_key, s3_bucket, neo4j_user, neo4j_password) came locally from
  # the untracked .env, which does not exist on a runner. Reproduced on a
  # .env-free checkout: "Run tests" failed collection (15 errors, "6
  # validation errors for Settings") and the migration check failed ("9
  # validation errors"). Throwaway CI-only values are set here; everything
  # else comes from scripts/test-backend.env, the same file local runs use.
  # LLM_PROVIDER is fake and every Gemini key is blank - this workflow holds
  # no secrets and makes no real-provider call.
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SIGNING_KEY: ci-only-throwaway-jwt-signing-key-not-a-secret
      S3_ACCESS_KEY: changeme
      S3_SECRET_KEY: changeme
      S3_BUCKET: tenderos-ci
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme
      LLM_PROVIDER: fake
      GEMINI_API_KEY: ""
      COMPLIANCE_GEMINI_API_KEY: ""
      TALENT_GEMINI_API_KEY: ""
      COMMERCIAL_GEMINI_API_KEY: ""
    services:
      # Images match docker-compose.yml exactly, so CI exercises the same
      # versions local dev and the real deployment do. Credentials below
      # are throwaway, scoped to this one ephemeral CI run - never the
      # real values from .env (gitignored, never committed - checked
      # directly before writing this).
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: tenderos
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: tenderos_test
        # 5433 on the runner, as on the dev host (docker-compose.yml): the
        # test steps source scripts/test-backend.env, whose DSN uses 5433.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tenderos -d tenderos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5.26.31-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
        env:
          NEO4J_AUTH: neo4j/changeme
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p changeme 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      # The S3 store needs a command (backend and health path) - GitHub
      # Actions' services: block has no command: field, so it is started
      # directly here. Same image, digest and settings as docker-compose.yml's
      # s3 service (VersityGW replaces MinIO, whose Docker Hub image is gone;
      # see KNOWN_LIMITATIONS.md). Credentials are the CI throwaway pair.
      # The named volume is required, not optional: the image has no /data,
      # and the posix backend exits at once ("chdir /data: no such file or
      # directory") without a mount there.
      - name: Start S3 (VersityGW)
        run: |
          docker run -d --name s3 -p 9000:9000 -v s3_data:/data \
            -e ROOT_ACCESS_KEY_ID=changeme -e ROOT_SECRET_ACCESS_KEY=changeme \
            -e VGW_PORT=":9000" \
            versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 \
            --health /health posix /data
          timeout 30 bash -c 'until curl -sf http://localhost:9000/health; do sleep 1; done'
      - run: uv sync
      # B17 Phase 0b: data/synthetic/ is gitignored except .gitkeep - the
      # fixtures are generated, never committed (make_synthetic_fixtures.py's
      # own docstring: keeps the repo diffable and nothing mistaken for real
      # tender content). On a fresh checkout they do not exist, and 19 tests
      # failed on a .env-free, fixture-free checkout until this step ran.
      # Both generators are deterministic and synthetic-only (Part N / L3: no
      # private tender data in CI); data_private/ is never read.
      - name: Generate synthetic fixtures
        run: |
          uv run python scripts/make_synthetic_fixtures.py
          uv run python scripts/synthetic_tender_a.py
      # Phase 4 item 17: synthetic_tender_a.py rewrites the tracked manifest
      # of the files it generates (SHA-256 each). A generator change that
      # moves any byte shows up as a manifest diff and fails here; the
      # sha256sum check then confirms the files on disk are the ones listed.
      - name: Synthetic manifest matches the generated files
        run: |
          git diff --exit-code -- data/synthetic/tender_a/SHA256SUMS data/ground_truth
          sha256sum -c data/synthetic/tender_a/SHA256SUMS
      - name: Verify migrations apply cleanly (upgrade -> downgrade -> upgrade)
        run: |
          set -a && . scripts/test-backend.env && set +a
          uv run python scripts/verify_migrations.py
      # Phase 4 item 15: tests/unit/test_ocr_path.py skips without the
      # tesseract binary (the Windows host); here it is installed, and
      # TENDEROS_REQUIRE_OCR below turns that skip into a failure, so the
      # OCR path cannot silently go untested in CI.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      # Phase 4 item 14: the embedding and reranker models load by name
      # (ingestion/embed.py, agents/knowledge/rerank.py). The images bake
      # them in and run offline (decision 0018); tests run on the runner,
      # so the models are cached here and the test step runs offline too:
      # a model missing from the cache fails the run instead of being
      # downloaded mid-test. The key is built from the names the code
      # itself uses, so renaming a model cannot reuse a stale cache.
      - name: Model names for the Hugging Face cache key
        id: models
        run: |
          names=$(uv run python -c "from tenderos_backend.ingestion.embed import _MODEL_NAME as e; from tenderos_backend.agents.knowledge.rerank import _MODEL_NAME as r; print(f'{e}+{r}'.replace('/', '_'))")
          echo "key=hf-${names}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hfcache
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.models.outputs.key }}
      - name: Download the models (cache miss only)
        if: steps.hfcache.outputs.cache-hit != 'true'
        run: uv run python -c "from tenderos_backend.ingestion.embed import _get_model as e; from tenderos_backend.agents.knowledge.rerank import _get_model as r; e(); r()"
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TENDEROS_REQUIRE_OCR: "1"
        run: |
          set -a && . scripts/test-backend.env && set +a
          uv run pytest

  # B17 Phase 0b: A2's CI row (Build Guide :176) names lint, typecheck and
  # tests; the frontend had only eslint here. tsc and vitest for apps/web,
  # and tsc + eslint + build for apps/landing, were run locally only.
  # No secrets, no services, no backend - pure static checks and unit tests.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      # Phase 4 item 7: the npm this job runs is the one package.json's
      # packageManager names (npm does not enforce the field itself).
      - name: npm matches packageManager
        run: test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      # Phase 4 item 7: the npm this job runs is the one package.json's
      # packageManager names (npm does not enforce the field itself).
      - name: npm matches packageManager
        run: test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Phase 4 plan item 30: the golden-path E2E (apps/web/e2e/full-flow.spec.ts,
  # unchanged) on the fake-provider stack, so a PR meets the E2E stop-gate
  # here and not only on a laptop. The same stack scripts/fake-stack.ps1
  # starts locally: the three compose files, plus docker-compose.ci-e2e.yml
  # pointing the services at the images built once below. No secrets: the
  # .env is built from .env.example with values generated for this run
  # (scripts/ci_e2e_env.py), LLM_PROVIDER is fake, every Gemini key blank.
  #
  # Blocking: a failing e2e fails the run. It ran non-blocking
  # (continue-on-error) until 5 consecutive main runs passed with their
  # step 11 timelines recorded, counted from the one-time spec edit's merge
  # (runs 41617547377 to 41675559313, 2026-11-03; KNOWN_LIMITATIONS, item
  # 30). Step 11 still depends on timing, so every run keeps writing its
  # timeline to the job summary and the e2e-logs artifact.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: tenderos
      # Every docker compose command in this job uses all four files. A
      # partial file list starts the stack with the wrong settings and still
      # looks healthy (KNOWN_LIMITATIONS, environment traps, incident 13).
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml:docker-compose.e2e-fake.yml:docker-compose.ci-e2e.yml
    # Disk: the first run (39959278103) filled the runner's disk after the
    # builds and the stack start (ENOSPC at setup-node; its log never
    # reached GitHub). So: toolchains this job never uses are removed first,
    # the host gets only what its scripts import (no torch), the builder's
    # own copy of the layers is dropped once the images are loaded, and
    # every big stage ends with `df -h /`, so a future failure names its
    # stage.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (toolchains and images this job does not use)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      # The host runs four scripts: ci_e2e_env.py and e2e_step11_timeline.py
      # use the standard library only; the two fixture generators import
      # python-docx, openpyxl and Pillow. Those (with their own dependencies)
      # are installed at uv.lock's versions, so the fixtures are the bytes
      # the test job generates, instead of `uv sync`, which installs the
      # whole workspace, torch included. A generator that gains an import
      # fails at that import, here.
      - name: Install what the host-side scripts import (versions from uv.lock)
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-workspace --all-packages \
            | grep -E '^(python-docx|openpyxl|pillow|lxml|typing-extensions|et-xmlfile)==' \
            > "$RUNNER_TEMP/host-requirements.txt"
          test "$(wc -l < "$RUNNER_TEMP/host-requirements.txt")" -eq 6
          uv venv --python 3.12 "$RUNNER_TEMP/host-venv"
          uv pip install --python "$RUNNER_TEMP/host-venv" -r "$RUNNER_TEMP/host-requirements.txt"
          echo "HOST_PYTHON=$RUNNER_TEMP/host-venv/bin/python" >> "$GITHUB_ENV"
          df -h /
      - name: Write the compose .env (generated values, fake provider)
        run: '"$HOST_PYTHON" scripts/ci_e2e_env.py'
      # The spec uploads the synthetic tender package from data/synthetic/
      # (gitignored, generated as in the test job).
      - name: Generate synthetic fixtures
        run: |
          "$HOST_PYTHON" scripts/make_synthetic_fixtures.py
          "$HOST_PYTHON" scripts/synthetic_tender_a.py
      # One build per Dockerfile, cached in the GitHub Actions cache (one
      # scope each, mode=max so the torch and model layers are reused). A
      # lockfile change (every Dependabot uv PR) invalidates the dependency
      # layer and everything after it, so those runs pay close to a cold
      # build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the api image (api, migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: tenderos-ci/api:e2e
          load: true
          provenance: false
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,scope=e2e-api,mode=max
      - name: Disk after the api build
        run: df -h /
      - name: Build the worker image (the four workers and outbox_dispatcher)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          tags: tenderos-ci/worker:e2e
          load: true
          provenance: false
          cache-from: type=gha,scope=e2e-worker
          cache-to: type=gha,scope=e2e-worker,mode=max
      - name: Disk after the worker build
        run: df -h /
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tenderos-ci/web:e2e
          load: true
          provenance: false
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,scope=e2e-web,mode=max
      - name: Disk after the web build
        run: |
          df -h /
          docker image ls 'tenderos-ci/*'
      # Each build has already written its layers to the GitHub Actions
      # cache (cache-to) and loaded its image into Docker, so the builder's
      # own store is a second copy of the same layers. Dropping it is the
      # biggest single saving; the next run reads the layers from the cache.
      - name: Drop the builder's copy of the layers
        run: |
          docker buildx du | tail -n 2
          docker buildx prune --all --force > /dev/null
          docker system df
          df -h /
      # What scripts/fake-stack.ps1 does locally, minus the Redis flush: a
      # fresh runner has no orphaned scheduled jobs to clear.
      - name: Start the stack
        run: |
          docker compose up -d --no-build migrate api web workflow_worker ingestion_worker maintenance_worker operations_worker outbox_dispatcher
          test "$(docker inspect -f '{{.State.ExitCode}}' tenderos-migrate-1)" = 0
          df -h /
      - name: Wait for the api and the web app
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8000/health/ready > /dev/null; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 3; done'
      - name: Every app service runs the fake provider
        run: |
          for svc in api workflow_worker ingestion_worker maintenance_worker operations_worker outbox_dispatcher; do
            provider=$(docker compose exec -T "$svc" printenv LLM_PROVIDER)
            echo "$svc: LLM_PROVIDER=$provider"
            test "$provider" = fake
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - run: npm ci
        working-directory: apps/web
      # The Playwright version in apps/web's lockfile, with its own Chromium.
      - name: Install Chromium for the lockfile's Playwright
        run: |
          npx playwright install --with-deps chromium
          df -h /
        working-directory: apps/web
      - name: Run the golden-path E2E
        run: npx playwright test
        working-directory: apps/web
      - name: Save the stack's logs
        if: always()
        run: |
          df -h /
          mkdir -p e2e-logs
          docker compose ps -a > e2e-logs/ps.txt
          docker compose logs --no-color --timestamps > e2e-logs/compose.log
          # Plan item 44: the workflow outbox rows' creation times, for the
          # timeline's "last workflow event" (no payloads).
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q' < scripts/e2e_outbox_export.sql > e2e-logs/outbox.tsv || true
      # $HOST_PYTHON, not `uv run`: inside the project, `uv run` would sync
      # the whole workspace (torch included) first.
      - name: Step 11 timeline
        if: always()
        run: |
          "$HOST_PYTHON" scripts/e2e_step11_timeline.py e2e-logs/compose.log --outbox e2e-logs/outbox.tsv --json e2e-logs/step11.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Masking covers the console log, not artifact files: the logs are
      # uploaded only if none of this run's generated values appears in them.
      - name: No generated value in the saved logs
        id: logscan
        if: always()
        run: '"$HOST_PYTHON" scripts/ci_e2e_env.py --scan e2e-logs'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.logscan.outcome == 'success'
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  # B15: secret scanning + dependency scanning. detect-secrets-hook (the
  # same command pre-commit runs locally, not `detect-secrets scan` -
  # verified directly, not assumed: `scan` merges new findings INTO the
  # baseline rather than failing on them, which would make this check
  # silently toothless) re-checks every tracked file against
  # .secrets.baseline on every push/PR - a change that introduces a
  # genuinely new secret fails here even if the developer's own
  # pre-commit hook was skipped or never installed. This is the real
  # enforcement backstop; pre-commit is the fast local check.
  # pip-audit/npm audit check installed dependencies against known
  # vulnerability databases - unlike the other CI jobs, this one can fail
  # on a later run with no code change at all (a new CVE gets published
  # against an already-pinned version), which is expected and correct,
  # not flaky.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - run: uv sync
      - name: detect-secrets
        # NUL-delimited throughout (git ls-files -z / grep -z / mapfile -d
        # '') and the array expanded quoted ("${FILES[@]}") - the original
        # newline-delimited `FILES=$(...)` handed to an unquoted `$FILES`
        # underwent normal shell word-splitting AND globbing on every
        # filename, which happens to be harmless only as long as no
        # tracked file ever contains a space or a glob character.
        run: |
          mapfile -d '' -t FILES < <(git ls-files -z | grep -zv -E '\.venv/|apps/web/node_modules/|apps/web/playwright-report/|KNOWN_LIMITATIONS\.md')
          uv run detect-secrets-hook --baseline .secrets.baseline "${FILES[@]}"
      - run: uv run pip-audit
      # Phase 4 item 8: pip-audit skips torch (the +cpu build is not on
      # PyPI), so its advisories are queried from OSV directly. Exit 1 on
      # any advisory, exit 2 if the check could not run.
      - name: torch advisories (OSV)
        run: uv run python scripts/check_torch_osv.py
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
      # Phase 4 item 10: apps/landing has its own lockfile.
      - run: npm ci
        working-directory: apps/landing
      - run: npm audit --audit-level=high
        working-directory: apps/landing
