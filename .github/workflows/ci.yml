name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: uv run ruff check .
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest

  # B15: secret scanning + dependency scanning. detect-secrets-hook (the
  # same command pre-commit runs locally, not `detect-secrets scan` -
  # verified directly, not assumed: `scan` merges new findings INTO the
  # baseline rather than failing on them, which would make this check
  # silently toothless) re-checks every tracked file against
  # .secrets.baseline on every push/PR - a change that introduces a
  # genuinely new secret fails here even if the developer's own
  # pre-commit hook was skipped or never installed. This is the real
  # enforcement backstop; pre-commit is the fast local check.
  # pip-audit/npm audit check installed dependencies against known
  # vulnerability databases - unlike the other CI jobs, this one can fail
  # on a later run with no code change at all (a new CVE gets published
  # against an already-pinned version), which is expected and correct,
  # not flaky.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - name: detect-secrets
        # NUL-delimited throughout (git ls-files -z / grep -z / mapfile -d
        # '') and the array expanded quoted ("${FILES[@]}") - the original
        # newline-delimited `FILES=$(...)` handed to an unquoted `$FILES`
        # underwent normal shell word-splitting AND globbing on every
        # filename, which happens to be harmless only as long as no
        # tracked file ever contains a space or a glob character.
        run: |
          mapfile -d '' -t FILES < <(git ls-files -z | grep -zv -E '\.venv/|apps/web/node_modules/|apps/web/playwright-report/|KNOWN_LIMITATIONS\.md')
          uv run detect-secrets-hook --baseline .secrets.baseline "${FILES[@]}"
      - run: uv run pip-audit
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
